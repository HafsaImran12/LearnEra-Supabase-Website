<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp page</title>
    <link rel="shortcut icon" href="./images/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="../bootstrap.css" />
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar navbar-expand-lg bg-body" id="navbar">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center fw-bold"
          href="../index.html"
        >
          <img
            src="../images/logo.png"
            alt="Logo"
            width="60"
            height="54"
            class="d-inline-block align-text-top"
          />
          Learn <span class="text-warning">Era</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <div class="text-center ms-auto">
            <a
              href="../index.html"
              class="text-black bg-warning p-2 rounded-2 text-decoration-none"
              >Back to Home</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- ==================== SIGNUP CARD ==================== -->

    <div class="w-100 px-4 py-5 bg-white">
      <div class="container">
        <form id="studentRegistration">
          <div class="row">
            <div class="col">
              <div class="card card-registration bg-light">
                <div class="row g-0">
                  <div class="col-xl-6 d-none d-xl-block">
                    <img
                      src="../images/formImg.png"
                      alt="Signup Photo"
                      class="img-fluid h-100"
                      style="
                        border-top-left-radius: 0.25rem;
                        border-bottom-left-radius: 0.25rem;
                      "
                    />
                  </div>
                  <div class="col-xl-6">
                    <div class="card-body p-md-5">
                      <h4 class="mb-3 mb-md-5 text-center text-uppercase">
                        Student registration form
                      </h4>

                      <!-- first name -->

                      <div class="row">
                        <div class="col-md-6 mb-2 mb-md-4">
                          <div
                            data-mdb-input-init=""
                            class="form-outline"
                            data-mdb-input-initialized="true"
                          >
                            <label
                              class="form-label"
                              for="form3Example1m"
                              style="margin-left: 0px"
                              >First name</label
                            >
                            <input
                              type="text"
                              id="form3Example1m"
                              class="form-control"
                              name="firstname"
                              placeholder="First name"
                            />
                            <div class="form-notch">
                              <div
                                class="form-notch-leading"
                                style="width: 9px"
                              ></div>
                              <div
                                class="form-notch-middle"
                                style="width: 68.8px"
                              ></div>
                              <div class="form-notch-trailing"></div>
                            </div>
                          </div>
                        </div>

                        <!-- last name -->

                        <div class="col-md-6 mb-2 mb-md-4">
                          <div
                            data-mdb-input-init=""
                            class="form-outline"
                            data-mdb-input-initialized="true"
                          >
                            <label
                              class="form-label"
                              for="form3Example1n"
                              style="margin-left: 0px"
                              >Last name</label
                            >
                            <input
                              type="text"
                              id="form3Example1n"
                              class="form-control"
                              name="lastname"
                              placeholder="Last name"
                            />
                            <div class="form-notch">
                              <div
                                class="form-notch-leading"
                                style="width: 9px"
                              ></div>
                              <div
                                class="form-notch-middle"
                                style="width: 68px"
                              ></div>
                              <div class="form-notch-trailing"></div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <!-- city -->

                      <div
                        data-mdb-input-init=""
                        class="form-outline mb-2 mb-md-4"
                        data-mdb-input-initialized="true"
                      >
                        <label
                          class="form-label"
                          for="form3Example99"
                          style="margin-left: 0px"
                          >City</label
                        >
                        <input
                          type="text"
                          id="form3Example99"
                          class="form-control"
                          name="city"
                          placeholder="City"
                        />
                        <div class="form-notch">
                          <div
                            class="form-notch-leading"
                            style="width: 9px"
                          ></div>
                          <div
                            class="form-notch-middle"
                            style="width: 48.8px"
                          ></div>
                          <div class="form-notch-trailing"></div>
                        </div>
                      </div>

                      <!-- gender -->

                      <div
                        class="d-md-flex justify-content-start align-items-center mb-2 mb-md-4 py-2"
                      >
                        <h6 class="mb-0 me-4">Gender:</h6>

                        <div class="form-check form-check-inline mb-0 me-4">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="maleGender"
                            value="male"
                          />
                          <label class="form-check-label" for="maleGender"
                            >Male</label
                          >
                        </div>

                        <div class="form-check form-check-inline mb-0 me-4">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="femaleGender"
                            value="female"
                          />
                          <label class="form-check-label" for="femaleGender"
                            >Female</label
                          >
                        </div>
                      </div>

                      <!-- course -->

                      <div
                        data-mdb-input-init=""
                        class="form-outline mb-2 mb-md-4"
                        data-mdb-input-initialized="true"
                      >
                        <select
                          class="form-select"
                          aria-label="Default select example"
                          name="course"
                        >
                          <option value="" selected disabled>Courses</option>
                          <option value="Web Development">
                            Web Development
                          </option>
                          <option value="Digital Marketing">
                            Digital Marketing
                          </option>
                          <option value="UI/UX Designing">
                            UI/UX Designing
                          </option>
                          <option value="Data science">Data science</option>
                        </select>
                      </div>

                      <!-- email -->

                      <div
                        data-mdb-input-init=""
                        class="form-outline mb-2 mb-md-4"
                        data-mdb-input-initialized="true"
                      >
                        <label
                          class="form-label"
                          for="form3Example97"
                          style="margin-left: 0px"
                          >Email ID</label
                        >
                        <input
                          type="email"
                          id="form3Example97"
                          class="form-control"
                          name="email"
                          placeholder="example@gmail.com"
                        />
                        <div class="form-notch">
                          <div
                            class="form-notch-leading"
                            style="width: 9px"
                          ></div>
                          <div
                            class="form-notch-middle"
                            style="width: 54.4px"
                          ></div>
                          <div class="form-notch-trailing"></div>
                        </div>
                      </div>

                      <!-- password -->

                      <div
                        data-mdb-input-init=""
                        class="form-outline mb-2 mb-md-4"
                        data-mdb-input-initialized="true"
                      >
                        <label
                          class="form-label"
                          for="form3Example97"
                          style="margin-left: 0px"
                          >Password</label
                        >
                        <input
                          type="password"
                          id="form3Example97"
                          class="form-control"
                          name="password"
                          placeholder="Password"
                        />
                        <div class="form-notch">
                          <div
                            class="form-notch-leading"
                            style="width: 9px"
                          ></div>
                          <div
                            class="form-notch-middle"
                            style="width: 54.4px"
                          ></div>
                          <div class="form-notch-trailing"></div>
                        </div>
                      </div>

                      <!-- buttons -->

                      <div
                        class="d-flex flex-column flex-md-row justify-content-between align-items-center pt-3"
                      >
                        <p class="text-center text-secondary mt-4">
                          Already have an account?
                          <a
                            href="./login.html"
                            class="text-primary fw-semibold text-decoration-underline"
                          >
                            Login
                          </a>
                        </p>
                        <button
                          type="submit"
                          data-mdb-button-init=""
                          data-mdb-ripple-init=""
                          class="btn btn-warning"
                          data-mdb-button-initialized="true"
                          id="submitBtn"
                        >
                          Submit form
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="./bootstrap.js"></script>

    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SWEETALERT JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SUPABASE JS -->
    <script src="../supabase.js"></script>

    <!-- SIGNUP JS -->
    <script src="../js/signup.js"></script>
  </body>
</html>
