<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-M-S</title>
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./bootstrap.css">
</head>

<body>
    <section class="w-100 px-4 py-5 bg-dark" style="border-radius: .5rem .5rem 0 0;">
        <div class="container">
            <form id="studentRegistration">
                <div class="row">
                    <div class="col">
                        <div class="card card-registration">
                            <div class="row g-0">
                                <div class="col-xl-6 d-none d-xl-block">
                                    <img src="./images/form-image.png" alt="Sample photo" class="img-fluid"
                                        style="border-top-left-radius: .25rem; border-bottom-left-radius: .25rem;">
                                </div>
                                <div class="col-xl-6">
                                    <div class="card-body p-md-5">
                                        <h4 class="mb-5 text-uppercase">Student registration form</h4>
                                        <!-- first name -->
                                        <div class="row">
                                            <div class="col-md-6 mb-4">
                                                <div data-mdb-input-init="" class="form-outline"
                                                    data-mdb-input-initialized="true">
                                                    <input type="text" id="form3Example1m"
                                                        class="form-control form-control-lg" name="firstname">
                                                    <label class="form-label" for="form3Example1m"
                                                        style="margin-left: 0px;">First name</label>
                                                    <div class="form-notch">
                                                        <div class="form-notch-leading" style="width: 9px;"></div>
                                                        <div class="form-notch-middle" style="width: 68.8px;"></div>
                                                        <div class="form-notch-trailing"></div>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- last name -->
                                            <div class="col-md-6 mb-4">
                                                <div data-mdb-input-init="" class="form-outline"
                                                    data-mdb-input-initialized="true">
                                                    <input type="text" id="form3Example1n"
                                                        class="form-control form-control-lg" name="lastname">
                                                    <label class="form-label" for="form3Example1n"
                                                        style="margin-left: 0px;">Last name</label>
                                                    <div class="form-notch">
                                                        <div class="form-notch-leading" style="width: 9px;"></div>
                                                        <div class="form-notch-middle" style="width: 68px;"></div>
                                                        <div class="form-notch-trailing"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- address -->
                                        <div data-mdb-input-init="" class="form-outline mb-4"
                                            data-mdb-input-initialized="true">
                                            <input type="text" id="form3Example8" class="form-control form-control-lg"
                                                name="address">
                                            <label class="form-label" for="form3Example8"
                                                style="margin-left: 0px;">Address</label>
                                            <div class="form-notch">
                                                <div class="form-notch-leading" style="width: 9px;"></div>
                                                <div class="form-notch-middle" style="width: 55.2px;"></div>
                                                <div class="form-notch-trailing"></div>
                                            </div>
                                        </div>
                                        <!-- gender -->
                                        <div class="d-md-flex justify-content-start align-items-center mb-4 py-2">

                                            <h6 class="mb-0 me-4">Gender: </h6>

                                            <div class="form-check form-check-inline mb-0 me-4">
                                                <input class="form-check-input" type="radio" name="gender"
                                                    id="femaleGender" value="female">
                                                <label class="form-check-label" for="femaleGender">Female</label>
                                            </div>

                                            <div class="form-check form-check-inline mb-0 me-4">
                                                <input class="form-check-input" type="radio" name="gender"
                                                    id="maleGender" value="male">
                                                <label class="form-check-label" for="maleGender">Male</label>
                                            </div>

                                            <div class="form-check form-check-inline mb-0">
                                                <input class="form-check-input" type="radio" name="gender"
                                                    id="otherGender" value="other">
                                                <label class="form-check-label" for="otherGender">Other</label>
                                            </div>

                                        </div>

                                        <!-- course -->

                                        <div data-mdb-input-init="" class="form-outline mb-4"
                                            data-mdb-input-initialized="true">
                                            <input type="text" id="form3Example99" class="form-control form-control-lg"
                                                name="course">
                                            <label class="form-label" for="form3Example99"
                                                style="margin-left: 0px;">Course</label>
                                            <div class="form-notch">
                                                <div class="form-notch-leading" style="width: 9px;"></div>
                                                <div class="form-notch-middle" style="width: 48.8px;"></div>
                                                <div class="form-notch-trailing"></div>
                                            </div>
                                        </div>
                                        <!-- email -->
                                        <div data-mdb-input-init="" class="form-outline mb-4"
                                            data-mdb-input-initialized="true">
                                            <input type="email" id="form3Example97" class="form-control form-control-lg"
                                                name="email">
                                            <label class="form-label" for="form3Example97"
                                                style="margin-left: 0px;">Email
                                                ID</label>
                                            <div class="form-notch">
                                                <div class="form-notch-leading" style="width: 9px;"></div>
                                                <div class="form-notch-middle" style="width: 54.4px;"></div>
                                                <div class="form-notch-trailing"></div>
                                            </div>
                                        </div>
                                        <!-- password -->
                                        <div data-mdb-input-init="" class="form-outline mb-4"
                                            data-mdb-input-initialized="true">
                                            <input type="password" id="form3Example97"
                                                class="form-control form-control-lg" name="email">
                                            <label class="form-label" for="form3Example97"
                                                style="margin-left: 0px;">Password</label>
                                            <div class="form-notch">
                                                <div class="form-notch-leading" style="width: 9px;"></div>
                                                <div class="form-notch-middle" style="width: 54.4px;"></div>
                                                <div class="form-notch-trailing"></div>
                                            </div>
                                        </div>
                                        <!-- buttons -->
                                        <div class="d-flex justify-content-end pt-3">
                                            <button type="button" data-mdb-button-init="" data-mdb-ripple-init=""
                                                class="btn btn-light btn-lg" data-mdb-button-initialized="true">Reset
                                                all</button>
                                            <button type="submit" data-mdb-button-init="" data-mdb-ripple-init=""
                                                class="btn btn-warning btn-lg ms-2"
                                                data-mdb-button-initialized="true">Submit
                                                form</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script src="./bootstrap.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./app.js"></script>

</body>

</html>
